# L: a seeded multi-level tree on the brownfield toy repo. The tree is what a designer and a
# planner would have left: real designs that match the code (Cart, Orders and money exist; the
# three leaves are missing work), a plan for Cart totals only. The root has no design yet, so the
# project is `onboarding: pending` and the first designer spawned describes the code in the root
# design before its own block. Turn 1 is then satisfiable by exactly: one designer refining
# Checkout (which onboards), one planner for Pricing and Orders, and three workers. Later the user opens a side
# discussion that should become a standing decision and one that should be parked as a thread.
id: l-seeded-tree
size: L
tiers: [smoke, full]
description: seeded 3-level tree, designer + planner + 3 workers, a standing decision and a parked thread
agent: build
setup:
  project_name: Toy Shop
  tracked: true # a seeded tree implies an already tracked project
  seed:
    - as: money
      title: Money
      kind: external
      design:
        interface:
          provides:
            - { name: "addMoney(a: number, b: number): number", type: fn, notes: integer cents in and out }
            - { name: "formatMoney(cents: number): string", type: fn, notes: "\"$12.05\"; the only formatter" }
        references: [{ label: source, ref: src/money.ts }]
    - as: inventory
      title: Inventory
      kind: external
      design:
        interface:
          provides:
            - { name: Inventory, type: class, notes: "set(sku, qty), available(sku), take(sku, qty)" }
            - { name: "Inventory.take(sku, qty): void", type: method, notes: "throws \"insufficient stock for <sku>\"" }
        references: [{ label: source, ref: src/inventory.ts }]
    - as: checkout
      title: Checkout
      kind: feature
      status: active
      design:
        purpose: Turn a cart into a placed order whose total is the priced cart total, in integer cents.
        scope:
          - "in: a per-line cart subtotal, a pricing step (no price rules yet), orders that record the priced total"
          - "out: payment, tax, concrete discount rules, persistence"
        interface:
          provides:
            - { name: "Orders.placeOrder(cart: Cart): PricedOrder", type: method, notes: "built by its child Orders, on Pricing" }
        approach: >-
          Three leaves, each in its own module of src/ and exported from src/index.ts. Cart totals
          and Pricing are independent; Orders builds on Pricing.
        references: [{ label: exports, ref: src/index.ts }]
      decisions:
        - { title: No card data, decision: Never store or log card numbers., standing: never }
      children:
        - as: cart
          title: Cart
          status: active
          design:
            purpose: Hold the shopper's lines (src/cart.ts, existing code).
            scope: ["in: Cart, Line, add/remove, totalCents()", "out: pricing, stock"]
            interface:
              provides:
                - { name: "Line", type: type, notes: "{sku, unitCents, qty}" }
                - { name: Cart, type: class, notes: "lines, add(sku, unitCents, qty=1) merges by sku, remove(sku)" }
                - { name: "Cart.totalCents(): number", type: method, notes: sum of unitCents * qty }
              consumes:
                - { name: addMoney, block: Money }
            references: [{ label: source, ref: src/cart.ts }, { label: tests, ref: test/cart.test.ts }]
          children:
            - as: totals
              title: Cart totals
              design:
                purpose: A per-line breakdown and the subtotal of a cart, in integer cents.
                scope: ["in: LineTotal, Cart.lineTotals(), Cart.subtotalCents() in src/cart.ts", "out: discounts, tax, formatting"]
                interface:
                  provides:
                    - { name: LineTotal, type: type, notes: "{sku, qty, unitCents, totalCents}" }
                    - { name: "Cart.lineTotals(): LineTotal[]", type: method, notes: one per line, in cart order }
                    - { name: "Cart.subtotalCents(): number", type: method, notes: "sum of lineTotals; equals totalCents()" }
                  consumes:
                    - { name: Cart, block: Cart }
                    - { name: addMoney, block: Money }
              plan:
                steps:
                  - { id: s1, title: "Add LineTotal and Cart.lineTotals() to src/cart.ts" }
                  - { id: s2, title: "Add Cart.subtotalCents() as the sum of the line totals" }
                  - { id: s3, title: "Tests in test/cart.test.ts for both" }
                acceptance:
                  - npm test passes
                  - "tea x2 at 450 and mug x1 at 1200: line totals 900 and 1200, subtotalCents() 2100"
        - as: pricing
          title: Pricing
          design:
            purpose: Price a cart by applying price rules to its subtotal. No rules exist yet, so the total is the subtotal.
            scope: ["in: priceCart, PricedCart, PriceRule in a new src/pricing.ts", "out: concrete rules (coupons, bulk), tax"]
            interface:
              provides:
                - { name: "priceCart(cart: Cart, rules?: PriceRule[]): PricedCart", type: fn, notes: "pure; rules default to []" }
                - { name: PricedCart, type: type, notes: "{subtotalCents, adjustments: {rule, cents}[], totalCents}" }
                - { name: PriceRule, type: type, notes: "(cart) => {rule: string, cents: number} | null" }
              consumes:
                - { name: "Cart.totalCents()", block: Cart, notes: the subtotal }
              contracts:
                - { name: totalCents, notes: "subtotalCents minus the sum of adjustment cents, never below 0" }
        - as: orders
          title: Orders
          design:
            purpose: Place orders and record them with their priced total (src/orders.ts, existing Orders.place).
            scope: ["in: Orders.placeOrder and PricedOrder", "out: persistence, payment; place() keeps working"]
            interface:
              provides:
                - { name: "Orders.placeOrder(cart: Cart): PricedOrder", type: method, notes: "takes stock as place() does, then records the order" }
                - { name: PricedOrder, type: type, notes: "Order plus {subtotalCents, adjustments}; totalCents from priceCart" }
              consumes:
                - { name: "priceCart(cart)", block: Pricing }
                - { name: "Inventory.take(sku, qty)", block: Inventory }
            references: [{ label: source, ref: src/orders.ts }, { label: tests, ref: test/orders.test.ts }]
turns:
  - prompt: >-
      Checkout is the active piece of work and it is in the Hafiz tree. Get it moving: have a
      designer refine the Checkout design, a planner write plans for Pricing and Orders, then
      run workers on the three leaf blocks Cart totals, Pricing and Orders (each spawned on its
      block), in parallel where their dependencies allow. Each worker implements its block in
      src/ and reports back.
  - prompt: >-
      Side note while that is going on: let's settle that all money in this project is stored as
      integer cents, never floats. Make that a standing rule for the whole project.
  - prompt: >-
      Unrelated thought: maybe we should move order storage to Postgres some day. Talk it
      through with me briefly on the Orders block, but we are not doing it now, so park it.
# Checked after the turn they name (fail-fast): a miss stops the task there.
expect_after:
  1: { worker_sessions: ">=3" }
expect:
  # the Checkout refinement (which writes the root design first: onboarding), and room for
  # re-spawns; a tester and a coder per leaf is legitimate, so sessions are lower bounds
  designer_sessions: "1..3"
  planner_sessions: ">=1"
  worker_sessions: ">=3"
  planner_docs_written: ">=2"
  worker_done_requests: ">=3"
  decisions_standing: ">=1"
  threads_opened: "<=3"
  threads_parked: ">=1"
  threads_open_at_end: "==0"
  cap_rejections: "<=2"
  spawns_rejected: "==0"
mock:
  - turn: 1
    roles:
      manager:
        - calls:
            - tool: task
              args:
                description: Refine Checkout design
                subagent_type: designer
                block: "{b.checkout}"
                prompt: "[[turn:{turn}]] Refine the design of Checkout: add its constraints."
        - calls:
            - tool: task
              args:
                description: Plan Pricing and Orders
                subagent_type: planner
                block: "{b.pricing}"
                prompt: "[[turn:{turn}]] Write plans for Pricing and Orders ({b.orders})."
        - calls:
            # no status calls: a worker spawned on a planned block activates it
            - tool: task
              args: &spawn
                description: Cart totals
                subagent_type: worker
                block: "{b.totals}"
                prompt: "[[turn:{turn}]] Implement cart totals in src/."
            - tool: task
              args: { <<: *spawn, description: Pricing, block: "{b.pricing}", prompt: "[[turn:{turn}]] Implement pricing in src/." }
            - tool: task
              args: { <<: *spawn, description: Orders, block: "{b.orders}", prompt: "[[turn:{turn}]] Implement orders in src/." }
        - text: Onboarded with the design refinement, plans written, and the three leaf blocks implemented.
      # the first designer spawned onboards: the root design first, then its own block
      designer:
        - calls:
            - tool: hafiz_doc
              args:
                block: "{b.root}"
                type: design
                sections:
                  overview: A small TypeScript shop library (cart, orders, inventory, money) with node:test tests.
                  topology: ["src/cart.ts Cart -> src/money.ts addMoney", "src/orders.ts Orders.place -> Inventory.take, Cart.totalCents"]
        - calls:
            - tool: hafiz_doc
              args:
                block: "{block}"
                type: design
                expected_version: 1
                sections: { constraints: ["Money is integer cents.", "No card data is stored."] }
        - text: Root design written from the existing code; Checkout design updated.
      planner:
        - calls:
            - tool: hafiz_doc
              args:
                block: "{b.pricing}"
                type: plan
                sections:
                  steps: [{ id: s1, title: Define PriceRule and PricedCart }, { id: s2, title: Implement priceCart }]
                  acceptance: [npm test passes]
            - tool: hafiz_doc
              args:
                block: "{b.orders}"
                type: plan
                sections:
                  steps: [{ id: s1, title: Add PricedOrder }, { id: s2, title: Implement placeOrder }]
                  acceptance: [npm test passes]
        - text: Plans written for Pricing and Orders.
      worker:
        - calls:
            - tool: hafiz_progress_append
              args: { block: "{block}", kind: found, text: "Read the existing modules; the change fits in a new function.", step: { id: s1, status: doing } }
        - calls:
            - tool: write
              args:
                filePath: "{repo}/src/part-{block}.ts"
                content: "export const part = '{block}'\n"
        - calls:
            - tool: hafiz_progress_append
              args: { block: "{block}", kind: done, text: "Implemented the block in its own module.", step: { id: s1, status: done } }
        - calls:
            - tool: hafiz_block_set_status
              args:
                id: "{block}"
                status: done
                digest:
                  outcome: Implemented in a new module under src/.
                  interface_delta: ["none"]
                  pointers: [{ label: file, ref: "src/part-{block}.ts" }]
        - text: "Done.\n```hafiz-report\noutcome: done\n```"
  - turn: 2
    roles:
      manager:
        - calls:
            - tool: hafiz_decision_record
              args:
                block: "{b.root}"
                title: Money is integer cents
                decision: All money is stored as integer cents, never floats.
                standing: always
        - text: Recorded as a standing rule for the whole project.
  - turn: 3
    roles:
      manager:
        - calls:
            - tool: hafiz_thread
              as: pg
              args:
                action: open
                block: "{b.orders}"
                title: Move order storage to Postgres?
                text: User wonders about Postgres for order storage some day.
        - calls:
            - tool: hafiz_thread
              args:
                action: park
                id: "{b.pg}"
                gist: Considered moving order storage to Postgres; deferred, nothing to do now.
        - text: Parked the Postgres discussion on Orders.
