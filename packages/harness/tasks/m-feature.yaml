# M: untracked at the start; a feature that should become a tracked block with 3-5 children, one worker per child.
id: m-feature
size: M
tiers: [full]
description: order discounts feature; expect a feature block + 4 children and a worker per child
agent: build
turns:
  - prompt: >-
      Add order discounts to the shop: percentage coupon codes, a bulk-quantity discount rule,
      applying discounts in the cart total, and showing them in the order summary. This is a
      multi-part feature, so plan it as tracked work: one block for the feature, one child block
      per part, and a worker subagent implementing each part (spawned on its block). Keep the
      work in src/. Discounts apply before tax, always.
expect:
  tracked: "==1" # the manager started tracking itself (its first hafiz_block_create)
  blocks_created: ">=5" # the feature and its four parts
  manager_decisions: ">=1" # "Discounts apply before tax, always."
  designer_sessions: "<=3" # none needed; one that onboards first and a re-spawn are legitimate
  worker_sessions: ">=4" # one per part; a tester and a coder per part is legitimate too
  worker_done_requests: ">=4"
  worker_progress_min: ">=1"
  worker_reports: ">=4"
  files_written: ">=4"
  threads_open_at_end: "==0"
  cap_rejections: "<=2"
  spawns_rejected: "==0"
mock:
  - turn: 1
    roles:
      manager:
        # the first block create tracks the repo; the block goes under the root
        - calls:
            - tool: hafiz_block_create
              as: feat
              args:
                title: Order discounts
                kind: feature
                design:
                  purpose: Let shoppers pay less through coupon codes and bulk-quantity rules.
                  scope: ["in: coupons, bulk rule, cart and order integration", "out: payment"]
                  interface: { provides: [{ name: applyDiscounts(cart), type: fn }], consumes: [] }
        - calls:
            - tool: hafiz_block_create
              as: coupons
              args: &child
                parent: "{b.feat}"
                title: Coupon codes
                design: { purpose: One part of order discounts., scope: ["in: this part only"], interface: { provides: [], consumes: [] } }
                plan: { steps: [{ id: s1, title: Model coupons }, { id: s2, title: Validate and apply }], acceptance: [tests pass] }
            - tool: hafiz_block_create
              as: bulk
              args: { <<: *child, title: Bulk quantity rule }
            - tool: hafiz_block_create
              as: cartint
              args: { <<: *child, title: Cart integration }
            - tool: hafiz_block_create
              as: summary
              args: { <<: *child, title: Order summary lines }
        - calls:
            - tool: hafiz_decision_record
              args:
                block: "{b.feat}"
                title: Discounts apply before tax
                decision: Discounts are computed on the pre-tax cart total, in integer cents.
            - tool: hafiz_block_set_status
              args: { id: "{b.feat}", status: active }
            - tool: hafiz_block_set_status
              args: { id: "{b.coupons}", status: active }
            - tool: hafiz_block_set_status
              args: { id: "{b.bulk}", status: active }
            - tool: hafiz_block_set_status
              args: { id: "{b.cartint}", status: active }
            - tool: hafiz_block_set_status
              args: { id: "{b.summary}", status: active }
        - calls:
            - tool: task
              args: &spawn
                description: Coupon codes
                subagent_type: worker
                block: "{b.coupons}"
                prompt: "[[turn:{turn}]] Implement the coupon codes part in src/."
            - tool: task
              args: { <<: *spawn, description: Bulk quantity rule, block: "{b.bulk}", prompt: "[[turn:{turn}]] Implement the bulk-quantity rule in src/." }
            - tool: task
              args: { <<: *spawn, description: Cart integration, block: "{b.cartint}", prompt: "[[turn:{turn}]] Apply discounts in the cart total in src/." }
            - tool: task
              args: { <<: *spawn, description: Order summary, block: "{b.summary}", prompt: "[[turn:{turn}]] Show discounts in order summaries in src/." }
        - text: All four parts of the discount feature are implemented and reported.
      worker:
        - calls:
            - tool: hafiz_progress_append
              args: { block: "{block}", kind: found, text: "Reviewed src/cart.ts and src/money.ts; the new code can live in its own module.", step: { id: s1, status: doing } }
        - calls:
            - tool: write
              args:
                filePath: "{repo}/src/discount-{block}.ts"
                content: "export const part = '{block}'\n"
        - calls:
            - tool: hafiz_progress_append
              args: { block: "{block}", kind: done, text: "Implemented the part in its own module.", step: { id: s1, status: done } }
        - calls:
            - tool: hafiz_block_set_status
              args:
                id: "{block}"
                status: done
                digest:
                  outcome: The part is implemented in a new module under src/.
                  interface_delta: ["none"]
                  pointers: [{ label: file, ref: "src/discount-{block}.ts" }]
        - text: "Implemented the part.\n```hafiz-report\noutcome: done\n```"
