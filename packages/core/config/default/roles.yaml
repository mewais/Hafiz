# A role is data: view, focus policy, command allowlist, rules file installed as the agent prompt
# (after the role's file, rules/common.md is appended for every agent role).
roles:
  manager:
    view: default
    focus_policy: all_active
    tools: [context.*, block.*, tree.list, edge.*, doc.patch:plan, decision.record,
            thread.*, progress.append, focus.set, proposal.*, session.status]
    rules: rules/manager.md
  designer:
    view: designer
    focus_policy: all_active
    tools: [context.*, block.read, tree.list, block.create, doc.write:design, doc.patch:design,
            edge.*, decision.record, thread.*, progress.append:found, progress.append:question]
    # block.create: external stubs, sub-components; progress: findings and questions only
    rules: rules/designer.md
  planner:
    view: default
    focus_policy: all_active
    tools: [context.*, block.read, tree.list, block.create, doc.write:plan, doc.patch:plan, thread.*]
    rules: rules/planner.md
  worker:
    view: worker
    focus_policy: spawned_block
    tools: [context.*, block.read, step.set, progress.append, thread.open, thread.park,
            doc.write:digest, block.request_done]
    rules: rules/worker.md
  user:
    view: default
    focus_policy: none
    tools: ['*']
    rules: rules/user.md
    agent: false
  # The Kilo TUI panel: reads only. The daemon refuses every write from a read_only session.
  viewer:
    view: default
    focus_policy: none
    tools: [tree.list, block.read, session.status, proposal.list]
    rules: rules/viewer.md
    agent: false
    read_only: true
