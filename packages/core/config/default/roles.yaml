# A role is data: view, focus policy, command allowlist, rules file installed as the agent prompt
# (after the role's file, rules/common.md is appended for every agent role).
# The allowlist names Core commands (`command`, `command:qualifier`, `ns.*`); Core enforces it, and
# the agent tools (commands/tools.ts) are narrowed to it: `thread.open` + `thread.park` leave
# hafiz_thread with those two actions, `doc.patch:plan` leaves hafiz_doc with type plan and no
# replace, `block.request_done` without `block.set_status:done` makes done a request. Edges are
# derived from designs, so no agent role holds `edge.*` (the CLI user does).
roles:
  manager:
    view: default
    focus_policy: all_active
    tools: [context.*, block.*, tree.list, doc.patch:plan, decision.record, thread.*,
            progress.append, focus.set, proposal.*, session.status]
    rules: rules/manager.md
  designer:
    view: designer
    focus_policy: spawned_block     # the block it is spawned on; the active front when used directly
    tools: [context.*, block.read, tree.list, block.create, doc.write:design, doc.patch:design,
            decision.record, thread.*, progress.append:found, progress.append:question]
    # block.create: external stubs, sub-components; progress: findings and questions only
    rules: rules/designer.md
  planner:
    view: planner                   # default, plus the designs of the blocks under its block
    focus_policy: spawned_block
    tools: [context.*, block.read, tree.list, block.create, doc.write:plan, doc.patch:plan, thread.*]
    rules: rules/planner.md
  worker:
    view: worker
    focus_policy: spawned_block
    # the digest goes with the done request (hafiz_block_set_status), not through hafiz_doc
    tools: [context.*, block.read, step.set, progress.append, thread.open, thread.park,
            block.request_done]
    rules: rules/worker.md
  user:
    view: default
    focus_policy: none
    tools: ['*']
    rules: rules/user.md
    agent: false
  # The Kilo TUI panel: reads only. The daemon refuses every write from a read_only session.
  viewer:
    view: default
    focus_policy: none
    tools: [tree.list, block.read, session.status, proposal.list]
    rules: rules/viewer.md
    agent: false
    read_only: true
