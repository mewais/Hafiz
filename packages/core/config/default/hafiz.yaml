# Top-level Hafiz settings. Layered: built-in defaults -> ~/.hafiz/config -> <store>/config
storage:
  backend: fs
  root: ~/.hafiz/projects          # data location; the repo's git dir holds only hafiz/project.yaml
  git:
    enabled: true
    minor_write_batch_seconds: 30
schema_set: default
schema_version: 1                     # bump with a migrations/<from>-<to>.yaml; `hafiz migrate` applies it
tokenizer:
  name: estimator
  soft_zone: 0.15                  # writes within cap*(1+soft_zone) succeed with a notice
windows:                           # context window per model family; used for budgets
  default: 200000
llm:
  # provider: none | kilo | openai-compatible | anthropic | fake (tests).  none = condensation
  # disabled (the host's own compaction stays on). kilo = run through Kilo itself (the Kilo plugin
  # only): model is a Kilo `provider/model`, no key needed, and the cost shows in Kilo's usage for
  # the session. Other real providers need model, api_key_env (the NAME of the environment
  # variable holding the key) and, for openai-compatible, base_url.
  #   condenser: { provider: kilo, model: anthropic/claude-haiku-4-5 }
  #   condenser: { provider: openai-compatible, base_url: https://openrouter.ai/api/v1,
  #                api_key_env: OPENROUTER_API_KEY, model: google/gemini-2.5-flash }
  condenser: { provider: none, model: cheap }
  drafters:  { enabled: false, provider: none, model: cheap }
daemon:
  idle_shutdown_seconds: 900
onboarding:
  # Tracking a repo that has commits and at least this many tracked source files (docs, licences
  # and dotfiles do not count) marks the project `onboarding: pending`: the manager has the
  # designer describe the existing codebase in the root design before new work. It is asked only
  # once tracked work starts (first block, first spawn on a block, or a root doc write), so a
  # one-off fix does not spawn a designer.
  min_source_files: 5
  # One line at the top of these roles' views once tracked work has started on a pending project; the rules say what to do.
  directive: "Onboarding pending: this repo had code before Hafiz started tracking it; follow your rules' Onboarding before new work."
  roles: [manager]
host:
  kilo:
    shaper: auto                   # proxy | hooks | auto (hooks when the host exposes them)
    tools: native                  # native (plugin tool hook, per-session) | mcp (hafiz-<role> servers)
    default_role: manager          # role for non-Hafiz primary agents (build, plan, …); none = unmanaged
    default_subagent_role: worker  # non-Hafiz subagents spawned on a block (task's `block`); none = unmanaged
    delegation_prompt_cap: 600     # tokens; a longer task prompt is refused (the subagent sees its block)
