status:
  transitions:
    planned: [active, dropped]
    active:  [blocked, done, dropped]
    blocked: [active, dropped]
    done:    [active]            # reopen
    dropped: []
  guards:
    to_done:    [digest_present_and_fresh, no_open_threads, children_closed, review_done]
    to_blocked: [blocked_on_required]
    to_dropped: [reason_required]
    reopen:     [reason_required]          # also marks the digest stale (command effect)
  activate_parent_on_child_active: true
  # A session of one of these roles opened on a `planned` block (spawned on it) activates the
  # block, and its planned ancestors as above, in the same write: spawning a worker is work
  # starting. Designing and planning are not, so those roles leave the status alone.
  activate_on_spawn: [worker]
epoch:
  minor_paths: [progress, steps, threads]     # writes here never bump the project epoch
caps:
  on_exceeded: reject                          # after the tokenizer soft zone
  allow_block_overrides: true                  # recorded as a decision
spawn:
  # Who may be spawned on a block (Kilo: the `task` tool's `block` argument), by the block's
  # state: no_design / no_plan / has_plan from its docs, done / dropped from its status.
  # A refused spawn names the missing step. `*` = any role.
  roles_by_state:
    no_design: [designer]
    no_plan:   [designer, planner]
    has_plan:  ['*']
    done:      []                          # reopen first
    dropped:   []
review:
  # Per event: off = no proposal; queue = a proposal for the review queue, work proceeds;
  # gate = a proposal, and the next stage on that block waits until it is accepted (one block
  # only: siblings and parents go on). design gates spawning the planner or a worker on the
  # block, plan gates workers, done gates the transition itself (set_status asks for
  # confirmation, a worker's done request waits for the manager).
  design: queue      # filed when the session that wrote the design ends, or on block.create
  plan:   queue
  done:   gate       # default holds done for confirmation (previously confirm_done: ask)
  drafts: queue      # condenser/drafter proposals; off | queue (drafts never gate)
  approver: user     # user | manager: who may accept or reject design/plan reviews
